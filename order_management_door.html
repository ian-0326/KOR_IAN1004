<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>KOR.IAN 採購後台</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
  <style>
    :root{
      --primary:#28b0eb;
      --bg:#f2f4f6;
      --card:#ffffff;
      --text:#191f28;
      --sub:#4e5968;
      --gray:#adb5bd;
      --line:#e5e8eb;
      --green:#21c67a;
      --red:#ff5b5b;
      --shadow:0 8px 28px rgba(0,0,0,.06);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{margin:0;background:var(--bg);color:var(--text);font-family:Georgia,Garamond,"Times New Roman",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang TC","Microsoft JhengHei",sans-serif;-webkit-font-smoothing:antialiased}
    .app{max-width:980px;margin:0 auto;min-height:100vh;padding:18px 16px 110px}
    .system-error{display:none;background:#fff0f0;color:#d93636;border:1px solid #ffd1d1;border-radius:20px;padding:14px 16px;margin-bottom:12px;font-size:13px;font-weight:800;line-height:1.6}
    .topbar{position:sticky;top:0;z-index:20;margin:0 -16px;padding:18px 16px 14px;background:rgba(242,244,246,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(229,232,235,.72)}
    .brand-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .brand{display:flex;align-items:center;gap:12px;min-width:0}
    .logo-mark{width:48px;height:48px;border-radius:18px;background:linear-gradient(135deg,#fff,#eaf7ff);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);color:var(--primary);flex-shrink:0}
    h1{font-size:22px;line-height:1.1;margin:0;font-weight:900;letter-spacing:.2px}
    .subline{font-size:12px;color:var(--gray);font-weight:700;margin-top:4px}
    .refresh-btn,.copy-btn,.clear-btn{border:0;border-radius:999px;background:#fff;color:var(--text);font-weight:900;padding:12px 14px;box-shadow:0 4px 14px rgba(0,0,0,.05);display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}
    .refresh-btn{color:var(--primary)}
    .filters{display:grid;grid-template-columns:1fr;gap:10px;margin-top:16px}.filter-card{background:#fff;border-radius:22px;padding:12px 14px;box-shadow:0 3px 14px rgba(0,0,0,.035)}
    .filter-label{font-size:11px;color:var(--gray);font-weight:900;margin-bottom:6px}.filter-input{width:100%;border:0;background:#f7f9fb;border-radius:14px;padding:12px 13px;font-size:14px;outline:none;color:var(--text);font-weight:700}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.stat{background:#fff;border-radius:24px;padding:16px;box-shadow:var(--shadow)}.stat-title{font-size:12px;color:var(--gray);font-weight:900}.stat-num{font-size:24px;font-weight:900;margin-top:8px;color:var(--text)}.stat.primary .stat-num{color:var(--primary)}
    .section-title{font-size:16px;font-weight:900;margin:18px 0 10px;display:flex;align-items:center;gap:8px}
    .product-card{background:#fff;border-radius:28px;padding:16px 16px;margin-bottom:12px;box-shadow:var(--shadow);position:relative;overflow:hidden;display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:flex-start}.product-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--primary);opacity:.9}
    .product-check{width:24px;height:24px;border:2px solid var(--gray);border-radius:7px;margin-top:2px;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;z-index:1;flex-shrink:0}.product-card.done .product-check{background:var(--primary);border-color:var(--primary);color:#fff}.product-check iconify-icon{display:none;font-size:18px}.product-card.done .product-check iconify-icon{display:block}.product-card.done .product-name,.product-card.done .product-url{opacity:.42;text-decoration:line-through}
    .product-main{min-width:0;position:relative;z-index:1}.product-name{font-size:16px;font-weight:900;line-height:1.45;word-break:break-word}.product-option{font-size:13px;color:var(--gray);font-weight:900;margin-top:4px}.product-url{margin-top:12px;display:flex;align-items:center;gap:8px}.product-link-btn{border:0;border-radius:999px;background:var(--primary);color:#fff;font-size:13px;font-weight:900;line-height:1;text-decoration:none;padding:11px 14px;display:inline-flex;align-items:center;gap:6px;box-shadow:0 6px 18px rgba(40,176,235,.24);white-space:nowrap}.product-link-btn:active{transform:scale(.98)}.product-url.empty-url{background:#f7f9fb;border-radius:18px;padding:12px 13px;font-size:13px;color:var(--gray);font-weight:800;line-height:1.45;display:flex;gap:8px;align-items:center}.product-qty{text-align:right;position:relative;z-index:1}.qty-label{font-size:11px;color:var(--gray);font-weight:900}.qty-num{font-size:30px;color:var(--primary);font-weight:900;line-height:1.1;margin-top:4px}
    .empty{background:#fff;border-radius:28px;padding:40px 20px;text-align:center;color:var(--gray);font-weight:900;box-shadow:var(--shadow);margin-top:20px}.empty iconify-icon{font-size:46px;color:var(--gray);display:block;margin:0 auto 12px}
    .bottom-actions{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center}.bottom-actions button{max-width:260px;flex:1;justify-content:center}
    @media(max-width:640px){.app{padding-left:14px;padding-right:14px}.topbar{margin-left:-14px;margin-right:-14px}.brand-row{align-items:flex-start}.refresh-btn span{display:none}.stats{grid-template-columns:1fr 1fr}.stat:last-child{grid-column:1/-1}.product-card{grid-template-columns:32px 1fr;gap:10px}.product-qty{grid-column:2;text-align:left;display:flex;align-items:baseline;gap:8px}.qty-num{font-size:24px}.product-url{font-size:12px}}
    @media print{body{background:#fff}.topbar,.bottom-actions{display:none!important}.app{max-width:none;padding:0}.product-card{box-shadow:none;border:1px solid #ddd;break-inside:avoid}}
  </style>
</head>
<body>
  <main class="app">
    <div class="system-error" id="systemError"></div>
    <div class="topbar">
      <div class="brand-row">
        <div class="brand">
          <div class="logo-mark"><iconify-icon icon="solar:suitcase-bold" style="font-size:30px"></iconify-icon></div>
          <div>
            <h1>KOR.IAN 採購後台</h1>
            <div class="subline" id="lastUpdated">尚未載入資料</div>
          </div>
        </div>
        <button class="refresh-btn" onclick="loadProducts()"><iconify-icon icon="solar:refresh-bold" style="font-size:18px"></iconify-icon><span>重新整理</span></button>
      </div>
      <div class="filters">
        <div class="filter-card">
          <div class="filter-label">搜尋商品名稱、款式、商品網址</div>
          <input id="keyword" class="filter-input" type="search" placeholder="輸入關鍵字即時篩選" oninput="renderAll()" />
        </div>
      </div>
    </div>

    <div class="stats">
      <div class="stat primary"><div class="stat-title">採購品項</div><div class="stat-num" id="statProducts">0</div></div>
      <div class="stat"><div class="stat-title">下單總數</div><div class="stat-num" id="statQty">0</div></div>
      <div class="stat"><div class="stat-title">已有網址</div><div class="stat-num" id="statUrls">0</div></div>
    </div>

    <section>
      <div class="section-title"><iconify-icon icon="solar:cart-check-bold" style="color:var(--primary)"></iconify-icon>待採購清單</div>
      <div id="productList"></div>
    </section>
  </main>

  <div class="bottom-actions">
    <button class="copy-btn" onclick="copyPurchaseText()"><iconify-icon icon="solar:copy-bold" style="font-size:18px"></iconify-icon>複製清單</button>
    <button class="clear-btn" onclick="window.print()"><iconify-icon icon="solar:printer-bold" style="font-size:18px"></iconify-icon>列印</button>
  </div>

  <script>
    const SUPABASE_URL = 'https://ivpctyqlrkjstfsoweeh.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJIUzI1NiIsInJlZiI6Iml2cGN0eXFscmtqc3Rmc293ZWVoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMxOTk1MTksImV4cCI6MjA4ODc3NTUxOX0.DYgzhaTH3_5NFwv009ZfZAshfUnCW2PeTuNcJ9feyMU';
  </script>
  <script>
    // 修正上一段常數中的 JWT iss 文字，避免手動搬移時誤改。
    const REAL_SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml2cGN0eXFscmtqc3Rmc293ZWVoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMxOTk1MTksImV4cCI6MjA4ODc3NTUxOX0.DYgzhaTH3_5NFwv009ZfZAshfUnCW2PeTuNcJ9feyMU';
    let supabaseClient = null;
    let allProducts = [];

    function initSupabaseClient(){
      if(supabaseClient) return supabaseClient;
      if(!window.supabase || typeof window.supabase.createClient !== 'function'){
        showSystemError('Supabase 套件尚未成功載入。請確認網路狀態，或重新整理頁面。');
        return null;
      }
      supabaseClient = window.supabase.createClient(SUPABASE_URL, REAL_SUPABASE_KEY);
      return supabaseClient;
    }

    function showSystemError(message){
      const box = document.getElementById('systemError');
      if(box){ box.style.display = 'block'; box.innerText = message; }
    }

    function clearSystemError(){
      const box = document.getElementById('systemError');
      if(box){ box.style.display = 'none'; box.innerText = ''; }
    }

    window.loadProducts = loadProducts;
    window.renderAll = renderAll;
    window.copyPurchaseText = copyPurchaseText;
    window.toggleDone = toggleDone;

    document.addEventListener('DOMContentLoaded', () => {
      initSupabaseClient();
      loadProducts();
    });

    async function loadProducts(){
      clearSystemError();
      const client = initSupabaseClient();
      if(!client) return;
      document.getElementById('productList').innerHTML = loadingHtml('正在讀取待採購商品...');

      try{
        const { data, error } = await client
          .from('products')
          .select('*')
          .gte('order_count', 1)
          .order('order_count', { ascending:false });

        if(error) throw error;
        allProducts = Array.isArray(data) ? data : [];
        document.getElementById('lastUpdated').innerText = `最後更新：${new Date().toLocaleString('zh-TW')}`;
        renderAll();
      }catch(error){
        const message = error && error.message ? error.message : String(error);
        document.getElementById('productList').innerHTML = `<div class="empty"><iconify-icon icon="solar:danger-triangle-bold"></iconify-icon>讀取失敗：${escapeHtml(message)}</div>`;
        showSystemError('products 資料讀取失敗。請確認 products 的 SELECT 權限、order_count 欄位是否存在，或網路連線是否正常。');
      }
    }

    function getFilteredProducts(){
      const kw = document.getElementById('keyword').value.trim().toLowerCase();
      const rows = allProducts.filter(product => Number(product.order_count || 0) >= 1);
      if(!kw) return rows;
      return rows.filter(product => {
        const text = [getProductName(product), getProductOption(product), getProductUrl(product)].filter(Boolean).join(' ').toLowerCase();
        return text.includes(kw);
      });
    }

    function renderAll(){
      const products = getFilteredProducts();
      renderStats(products);
      renderProducts(products);
    }

    function renderStats(products){
      const qty = products.reduce((sum,p)=>sum + Number(p.order_count || 0),0);
      const urlCount = products.filter(p => !!getProductUrl(p)).length;
      document.getElementById('statProducts').innerText = products.length;
      document.getElementById('statQty').innerText = qty;
      document.getElementById('statUrls').innerText = urlCount;
    }

    function renderProducts(products){
      const box = document.getElementById('productList');
      if(!products.length){ box.innerHTML = emptyHtml('目前沒有 order_count 大於等於 1 的商品'); return; }

      box.innerHTML = products.map(product => {
        const id = getProductId(product);
        const name = getProductName(product);
        const option = getProductOption(product);
        const url = getProductUrl(product);
        const qty = Number(product.order_count || 0);
        const done = isDone(id);
        return `
          <div class="product-card ${done ? 'done' : ''}" data-product-id="${escapeHtml(id)}">
            <button class="product-check" type="button" aria-label="標記已採購" onclick="toggleDone('${escapeJs(id)}')">
              <iconify-icon icon="solar:check-bold"></iconify-icon>
            </button>
            <div class="product-main">
              <div class="product-name">${escapeHtml(name)}</div>
              ${option ? `<div class="product-option">${escapeHtml(option)}</div>` : ''}
              ${url ? `
                <div class="product-url">
                  <a class="product-link-btn" href="${escapeAttr(url)}" target="_blank" rel="noopener noreferrer">
                    <iconify-icon icon="solar:link-bold" style="font-size:16px;flex-shrink:0"></iconify-icon>
                    查看商品頁
                  </a>
                </div>
              ` : `
                <div class="product-url empty-url">
                  <iconify-icon icon="solar:link-broken-bold" style="font-size:18px;flex-shrink:0"></iconify-icon>
                  尚未設定商品網址
                </div>
              `}
            </div>
            <div class="product-qty">
              <div class="qty-label">下單數量</div>
              <div class="qty-num">${qty}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    function getProductId(product){ return String(product.id ?? `${getProductName(product)}_${getProductOption(product)}`); }
    function getProductName(product){ return product.name_zh || product.name || product.product_name || product.title || '未命名商品'; }
    function getProductOption(product){ return product.option || product.variant || product.spec || ''; }
    function getProductUrl(product){ return product.olive_url || product.product_url || product.url || product.link || ''; }

    function toggleDone(id){
      const key = 'korian_purchase_done_products';
      const list = JSON.parse(localStorage.getItem(key) || '[]');
      const set = new Set(list);
      if(set.has(id)) set.delete(id); else set.add(id);
      localStorage.setItem(key, JSON.stringify(Array.from(set)));
      renderAll();
    }

    function isDone(id){
      const list = JSON.parse(localStorage.getItem('korian_purchase_done_products') || '[]');
      return list.includes(id);
    }

    function copyPurchaseText(){
      const products = getFilteredProducts();
      if(!products.length) return alert('目前沒有可複製的採購清單');
      const text = products.map(product => {
        const name = getProductName(product);
        const option = getProductOption(product);
        const qty = Number(product.order_count || 0);
        const url = getProductUrl(product) || '未設定網址';
        return `${name}${option ? '｜' + option : ''}\n下單數量：${qty}\n商品網址：${url}`;
      }).join('\n\n');

      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(()=>alert('已複製採購清單')).catch(()=>fallbackCopy(text));
      }else{
        fallbackCopy(text);
      }
    }

    function fallbackCopy(text){
      const area = document.createElement('textarea');
      area.value = text;
      area.style.position = 'fixed';
      area.style.left = '-9999px';
      document.body.appendChild(area);
      area.focus();
      area.select();
      document.execCommand('copy');
      area.remove();
      alert('已複製採購清單');
    }

    function loadingHtml(text){ return `<div class="empty"><iconify-icon icon="svg-spinners:180-ring"></iconify-icon>${text}</div>`; }
    function emptyHtml(text){ return `<div class="empty"><iconify-icon icon="solar:suitcase-bold"></iconify-icon>${text}</div>`; }
    function escapeHtml(v){ return String(v == null ? '' : v).replace(/[&<>'"]/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[s])); }
    function escapeAttr(v){ return escapeHtml(v); }
    function escapeJs(v){ return String(v == null ? '' : v).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,'\\n').replace(/\r/g,''); }
  </script>
</body>
</html>
