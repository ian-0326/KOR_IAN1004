<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>訂單管理</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
  <style>
    :root{
      --primary:#28b0eb;
      --bg:#f2f4f6;
      --card:#ffffff;
      --text:#191f28;
      --sub:#4e5968;
      --gray:#adb5bd;
      --line:#e5e8eb;
      --green:#21c67a;
      --red:#ff5b5b;
      --shadow:0 8px 28px rgba(0,0,0,.06);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{margin:0;background:var(--bg);color:var(--text);font-family:Georgia,Garamond,"Times New Roman",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang TC","Microsoft JhengHei",sans-serif;-webkit-font-smoothing:antialiased}
    .app{max-width:980px;margin:0 auto;min-height:100vh;padding:18px 16px 110px}
    .system-error{display:none;background:#fff0f0;color:#d93636;border:1px solid #ffd1d1;border-radius:20px;padding:14px 16px;margin-bottom:12px;font-size:13px;font-weight:800;line-height:1.6}
    .topbar{position:sticky;top:0;z-index:20;margin:0 -16px;padding:18px 16px 14px;background:rgba(242,244,246,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(229,232,235,.72)}
    .brand-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .brand{display:flex;align-items:center;gap:12px;min-width:0}
    .logo-mark{width:48px;height:48px;border-radius:18px;background:linear-gradient(135deg,#fff,#eaf7ff);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);color:var(--primary);flex-shrink:0}
    h1{font-size:22px;line-height:1.1;margin:0;font-weight:900;letter-spacing:.2px}
    .subline{font-size:12px;color:var(--gray);font-weight:700;margin-top:4px}
    .refresh-btn,.language-btn,.copy-btn,.clear-btn{border:0;border-radius:999px;background:#fff;color:var(--text);font-weight:900;padding:12px 14px;box-shadow:0 4px 14px rgba(0,0,0,.05);display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}
    .refresh-btn,.language-btn{color:var(--primary)}
    .language-btn.icon-only{width:44px;height:44px;padding:0;justify-content:center;gap:0}.language-btn.icon-only iconify-icon{font-size:22px!important}
    .filters{display:grid;grid-template-columns:1fr;gap:10px;margin-top:16px}.filter-card{background:#fff;border-radius:22px;padding:12px 14px;box-shadow:0 3px 14px rgba(0,0,0,.035)}
    .filter-label{font-size:11px;color:var(--gray);font-weight:900;margin-bottom:6px}.filter-input{width:100%;border:0;background:#f7f9fb;border-radius:14px;padding:12px 13px;font-size:14px;outline:none;color:var(--text);font-weight:700}
    .section-title{font-size:16px;font-weight:900;margin:18px 0 10px;display:flex;align-items:center;gap:8px}
    .product-card{background:#fff;border-radius:28px;padding:16px 16px;margin-bottom:12px;box-shadow:var(--shadow);position:relative;overflow:hidden;display:flex;flex-direction:column;gap:12px}.product-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--primary);opacity:.9}.product-card.completed:before{background:var(--green)}
    .product-top{display:block;position:relative;z-index:1}.product-main{min-width:0;position:relative;z-index:1}.product-name{font-size:16px;font-weight:900;line-height:1.45;word-break:break-word}.product-option{font-size:13px;color:var(--gray);font-weight:900;margin-top:4px}.product-card.completed .product-main,.product-card.completed .qty-row{opacity:.45;text-decoration:line-through;text-decoration-thickness:2px}.product-url{display:flex;justify-content:flex-start;align-items:center;gap:8px;flex-shrink:0}.product-link-btn{border:0;border-radius:999px;background:var(--primary);color:#fff;font-size:12px;font-weight:900;letter-spacing:.8px;line-height:1;text-decoration:none;padding:10px 13px;display:inline-flex;align-items:center;gap:5px;box-shadow:0 6px 18px rgba(40,176,235,.24);white-space:nowrap}.product-link-btn:active{transform:scale(.98)}.product-url.empty-url{font-size:12px;color:var(--gray);font-weight:900;line-height:1.45;justify-content:flex-start}.product-qty{position:relative;z-index:1;display:flex;flex-direction:column;gap:10px}.qty-row{display:flex;align-items:center;justify-content:flex-start;gap:6px;flex-shrink:0}.qty-block{background:#f7f9fb;border-radius:14px;padding:6px 8px;text-align:center;min-width:72px}.qty-label{font-size:10px;color:var(--gray);font-weight:900;white-space:nowrap}.qty-num{font-size:16px;color:var(--primary);font-weight:900;line-height:1.05;margin-top:3px}.qty-num.purchased{color:var(--green)}.purchase-control{display:flex;align-items:center;justify-content:flex-start;gap:8px;flex-wrap:nowrap;position:relative;z-index:1}.purchase-control .product-url{margin-right:0}.stepper{display:flex;align-items:center;background:#f7f9fb;border-radius:999px;padding:4px;gap:3px;flex-shrink:0}.step-btn{width:28px;height:28px;border:0;border-radius:999px;background:#fff;color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.05);font-weight:900;display:flex;align-items:center;justify-content:center;cursor:pointer}.step-btn:disabled{opacity:.35;cursor:not-allowed}.step-num{min-width:24px;text-align:center;font-weight:900;color:var(--text)}.finish-btn{border:0;border-radius:999px;background:var(--green);color:#fff;font-size:12px;font-weight:900;padding:10px 13px;box-shadow:0 6px 18px rgba(33,198,122,.22);cursor:pointer;white-space:nowrap;flex-shrink:0}.finish-btn:disabled{background:#d1d6dc;box-shadow:none;cursor:not-allowed}.finish-btn.is-loading{opacity:.7;pointer-events:none}
    .empty{background:#fff;border-radius:28px;padding:40px 20px;text-align:center;color:var(--gray);font-weight:900;box-shadow:var(--shadow);margin-top:20px}.empty iconify-icon{font-size:46px;color:var(--gray);display:block;margin:0 auto 12px}
    .bottom-actions{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center}.bottom-actions button{max-width:260px;flex:1;justify-content:center}
    @media(max-width:640px){.app{padding-left:14px;padding-right:14px}.topbar{margin-left:-14px;margin-right:-14px}.brand-row{align-items:flex-start}.language-btn span{font-size:12px}.refresh-btn span{display:none}.qty-row{gap:4px}.qty-block{min-width:54px;padding:5px 6px;border-radius:13px}.qty-label{font-size:9px}.qty-num{font-size:14px}.product-link-btn{padding:9px 11px}.purchase-control{justify-content:flex-start;gap:6px}.purchase-control .product-url{margin-right:0}.stepper{gap:2px}.finish-btn{padding:10px 12px}}
    @media print{body{background:#fff}.topbar,.bottom-actions{display:none!important}.app{max-width:none;padding:0}.product-card{box-shadow:none;border:1px solid #ddd;break-inside:avoid}}
  </style>
</head>
<body>
  <main class="app">
    <div class="system-error" id="systemError"></div>
    <div class="topbar">
      <div class="brand-row">
        <div class="brand">
          <div class="logo-mark"><iconify-icon icon="solar:suitcase-bold" style="font-size:30px"></iconify-icon></div>
          <div>
            <h1 id="pageTitle">訂單管理</h1>
            <div class="subline" id="lastUpdated">尚未載入資料</div>
          </div>
        </div>
        <button class="language-btn icon-only" onclick="toggleAdminLanguage()" type="button" aria-label="語言切換" title="語言切換">
          <iconify-icon id="adminLangIcon" icon="emojione-v1:flag-for-taiwan"></iconify-icon>
        </button>
      </div>
      <div class="filters">
        <div class="filter-card">
          <div class="filter-label" id="searchLabel">搜尋商品名稱、款式、商品網址</div>
          <input id="keyword" class="filter-input" type="search" placeholder="輸入關鍵字即時篩選" oninput="renderAll()" />
        </div>
      </div>
    </div>

    <section>
      <div class="section-title"><iconify-icon icon="solar:cart-check-bold" style="color:var(--primary)"></iconify-icon><span id="sectionTitleText">待採購清單</span></div>
      <div id="productList"></div>
    </section>
  </main>

  <div class="bottom-actions">
    <button class="copy-btn" onclick="copyPurchaseText()"><iconify-icon icon="solar:copy-bold" style="font-size:18px"></iconify-icon><span id="copyBtnText">複製清單</span></button>
    <button class="clear-btn" onclick="window.print()"><iconify-icon icon="solar:printer-bold" style="font-size:18px"></iconify-icon><span id="printBtnText">列印</span></button>
  </div>

  <script>
    const SUPABASE_URL = 'https://ivpctyqlrkjstfsoweeh.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJIUzI1NiIsInJlZiI6Iml2cGN0eXFscmtqc3Rmc293ZWVoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMxOTk1MTksImV4cCI6MjA4ODc3NTUxOX0.DYgzhaTH3_5NFwv009ZfZAshfUnCW2PeTuNcJ9feyMU';
  </script>
  <script>
    // 修正上一段常數中的 JWT iss 文字，避免手動搬移時誤改。
    const REAL_SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml2cGN0eXFscmtqc3Rmc293ZWVoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMxOTk1MTksImV4cCI6MjA4ODc3NTUxOX0.DYgzhaTH3_5NFwv009ZfZAshfUnCW2PeTuNcJ9feyMU';
    let supabaseClient = null;
    let allProducts = [];
    let currentLang = 'zh';
    let lastUpdatedAt = null;
    const purchaseDrafts = {};

    const ADMIN_TRANSLATIONS = {
      zh: {
        title: '訂單管理',
        langButton: '語言切換',
        notLoaded: '尚未載入資料',
        lastUpdated: '最後更新',
        searchLabel: '搜尋商品名稱、款式、商品網址',
        searchPlaceholder: '輸入關鍵字即時篩選',
        sectionTitle: '待採購清單',
        loading: '正在讀取待採購商品...',
        empty: '目前沒有 order_count 大於等於 1 的商品',
        orderedQty: '下單數量',
        purchasedQty: '已下單數量',
        noLink: '無連結',
        finish: '完成',
        writing: '寫入中',
        copy: '複製清單',
        print: '列印',
        unnamed: '未命名商品',
        noCopy: '目前沒有可複製的採購清單',
        copied: '已複製採購清單',
        notFound: '找不到這個商品資料，請重新整理後再試一次。',
        setQty: '請先設定本次完成數量。',
        readFailPrefix: '讀取失敗',
        writeFailPrefix: '寫入 purchase_count 失敗',
        noUrl: '未設定網址',
        copyOrderQty: '下單數量',
        urlLabel: '商品網址'
      },
      ko: {
        title: '주문 관리',
        langButton: '언어 전환',
        notLoaded: '아직 데이터를 불러오지 않았습니다',
        lastUpdated: '마지막 업데이트',
        searchLabel: '상품명, 옵션, 상품 링크 검색',
        searchPlaceholder: '키워드를 입력하면 바로 필터링됩니다',
        sectionTitle: '구매 대행 리스트',
        loading: '구매 대행 상품을 불러오는 중...',
        empty: 'order_count가 1 이상인 상품이 없습니다',
        orderedQty: '주문 수량',
        purchasedQty: '구매 완료',
        noLink: '링크 없음',
        finish: '완료',
        writing: '저장 중',
        copy: '리스트 복사',
        print: '인쇄',
        unnamed: '이름 없는 상품',
        noCopy: '복사할 구매 리스트가 없습니다',
        copied: '구매 리스트를 복사했습니다',
        notFound: '상품 정보를 찾을 수 없습니다. 새로고침 후 다시 시도해 주세요.',
        setQty: '이번에 완료할 수량을 먼저 설정해 주세요.',
        readFailPrefix: '불러오기 실패',
        writeFailPrefix: 'purchase_count 저장 실패',
        noUrl: '상품 링크 미설정',
        copyOrderQty: '주문 수량',
        urlLabel: '상품 링크'
      }
    };

    function t(key){ return (ADMIN_TRANSLATIONS[currentLang] && ADMIN_TRANSLATIONS[currentLang][key]) || ADMIN_TRANSLATIONS.zh[key] || key; }

    function initSupabaseClient(){
      if(supabaseClient) return supabaseClient;
      if(!window.supabase || typeof window.supabase.createClient !== 'function'){
        showSystemError(currentLang === 'ko' ? 'Supabase 패키지를 불러오지 못했습니다. 네트워크 상태를 확인하거나 새로고침해 주세요.' : 'Supabase 套件尚未成功載入。請確認網路狀態，或重新整理頁面。');
        return null;
      }
      supabaseClient = window.supabase.createClient(SUPABASE_URL, REAL_SUPABASE_KEY);
      return supabaseClient;
    }

    function showSystemError(message){
      const box = document.getElementById('systemError');
      if(box){ box.style.display = 'block'; box.innerText = message; }
    }

    function clearSystemError(){
      const box = document.getElementById('systemError');
      if(box){ box.style.display = 'none'; box.innerText = ''; }
    }

    window.loadProducts = loadProducts;
    window.renderAll = renderAll;
    window.copyPurchaseText = copyPurchaseText;
    window.updatePurchaseDraft = updatePurchaseDraft;
    window.completePurchase = completePurchase;
    window.toggleAdminLanguage = toggleAdminLanguage;

    document.addEventListener('DOMContentLoaded', () => {
      initSupabaseClient();
      applyAdminLanguage();
      loadProducts();
    });

    function toggleAdminLanguage(){
      currentLang = currentLang === 'zh' ? 'ko' : 'zh';
      applyAdminLanguage();
      renderAll();
    }

    function applyAdminLanguage(){
      document.documentElement.lang = currentLang === 'ko' ? 'ko' : 'zh-TW';
      document.title = t('title');
      const map = {
        pageTitle: t('title'),
        searchLabel: t('searchLabel'),
        sectionTitleText: t('sectionTitle'),
        copyBtnText: t('copy'),
        printBtnText: t('print')
      };
      Object.entries(map).forEach(([id, value]) => {
        const el = document.getElementById(id);
        if(el) el.innerText = value;
      });
      const icon = document.getElementById('adminLangIcon');
      if(icon) icon.setAttribute('icon', currentLang === 'zh' ? 'emojione-v1:flag-for-taiwan' : 'twemoji:flag-south-korea');
      const langButton = document.querySelector('.language-btn');
      if(langButton){
        langButton.setAttribute('aria-label', t('langButton'));
        langButton.setAttribute('title', t('langButton'));
      }
      const keyword = document.getElementById('keyword');
      if(keyword) keyword.setAttribute('placeholder', t('searchPlaceholder'));
      const lastUpdated = document.getElementById('lastUpdated');
      if(lastUpdated){
        if(lastUpdatedAt){
          lastUpdated.innerText = `${t('lastUpdated')}：${lastUpdatedAt.toLocaleString(currentLang === 'ko' ? 'ko-KR' : 'zh-TW')}`;
          lastUpdated.dataset.loadedAt = '1';
        }else{
          lastUpdated.innerText = t('notLoaded');
          delete lastUpdated.dataset.loadedAt;
        }
      }
    }

    async function loadProducts(){
      clearSystemError();
      const client = initSupabaseClient();
      if(!client) return;
      document.getElementById('productList').innerHTML = loadingHtml(t('loading'));

      try{
        const { data, error } = await client
          .from('products')
          .select('*')
          .gte('order_count', 1)
          .order('order_count', { ascending:false });

        if(error) throw error;
        allProducts = Array.isArray(data) ? data : [];
        lastUpdatedAt = new Date();
        const updatedEl = document.getElementById('lastUpdated');
        updatedEl.innerText = `${t('lastUpdated')}：${lastUpdatedAt.toLocaleString(currentLang === 'ko' ? 'ko-KR' : 'zh-TW')}`;
        updatedEl.dataset.loadedAt = '1';
        renderAll();
      }catch(error){
        const message = error && error.message ? error.message : String(error);
        document.getElementById('productList').innerHTML = `<div class="empty"><iconify-icon icon="solar:danger-triangle-bold"></iconify-icon>${t('readFailPrefix')}：${escapeHtml(message)}</div>`;
        showSystemError(currentLang === 'ko' ? 'products 데이터를 불러오지 못했습니다. SELECT 권한, order_count 컬럼 또는 네트워크 연결을 확인해 주세요.' : 'products 資料讀取失敗。請確認 products 的 SELECT 權限、order_count 欄位是否存在，或網路連線是否正常。');
      }
    }

    function getFilteredProducts(){
      const kw = document.getElementById('keyword').value.trim().toLowerCase();
      const rows = allProducts.filter(product => Number(product.order_count || 0) >= 1);
      if(!kw) return rows;
      return rows.filter(product => {
        const text = [getProductName(product), getProductOption(product), getProductUrl(product)].filter(Boolean).join(' ').toLowerCase();
        return text.includes(kw);
      });
    }

    function renderAll(){
      const products = getFilteredProducts();
      renderStats(products);
      renderProducts(products);
    }

    function renderStats(products){
      const statProducts = document.getElementById('statProducts');
      const statQty = document.getElementById('statQty');
      if(statProducts) statProducts.innerText = products.length;
      if(statQty) statQty.innerText = products.reduce((sum,p)=>sum + Number(p.order_count || 0),0);
    }

    function renderProducts(products){
      const box = document.getElementById('productList');
      if(!products.length){ box.innerHTML = emptyHtml(t('empty')); return; }

      box.innerHTML = products.map(product => {
        const id = getProductId(product);
        const name = getProductName(product);
        const option = getProductOption(product);
        const url = getProductUrl(product);
        const orderQty = Number(product.order_count || 0);
        const purchasedQty = Number(product.purchase_count || 0);
        const remainingQty = Math.max(orderQty - purchasedQty, 0);
        const draftQty = Number(purchaseDrafts[id] ?? (remainingQty > 0 ? remainingQty : 0));
        const isCompleted = purchasedQty >= orderQty && orderQty > 0;
        return `
          <div class="product-card ${isCompleted ? 'completed' : ''}" data-product-id="${escapeHtml(id)}">
            <div class="product-top">
              <div class="product-main">
                <div class="product-name">${escapeHtml(name)}</div>
                ${option ? `<div class="product-option">${escapeHtml(option)}</div>` : ''}
              </div>
            </div>
            <div class="purchase-control">
              ${url ? `
                <div class="product-url">
                  <a class="product-link-btn" href="${escapeAttr(url)}" target="_blank" rel="noopener noreferrer">
                    <iconify-icon icon="solar:link-bold" style="font-size:14px;flex-shrink:0"></iconify-icon>
                    LINK
                  </a>
                </div>
              ` : `
                <div class="product-url empty-url">${t('noLink')}</div>
              `}
              <div class="qty-row">
                <div class="qty-block">
                  <div class="qty-label">${t('orderedQty')}</div>
                  <div class="qty-num">${orderQty}</div>
                </div>
                <div class="qty-block">
                  <div class="qty-label">${t('purchasedQty')}</div>
                  <div class="qty-num purchased">${purchasedQty}</div>
                </div>
              </div>
              <div class="stepper" aria-label="調整本次完成數量">
                <button class="step-btn" type="button" onclick="updatePurchaseDraft('${escapeJs(id)}', -1)" ${draftQty <= 0 ? 'disabled' : ''}>−</button>
                <span class="step-num" id="draft-${escapeAttr(id)}">${draftQty}</span>
                <button class="step-btn" type="button" onclick="updatePurchaseDraft('${escapeJs(id)}', 1)" ${draftQty >= remainingQty ? 'disabled' : ''}>＋</button>
              </div>
              <button class="finish-btn" type="button" onclick="completePurchase('${escapeJs(id)}')" ${draftQty <= 0 || remainingQty <= 0 ? 'disabled' : ''}>${t('finish')}</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function getProductId(product){ return String(product.id ?? `${getProductName(product)}_${getProductOption(product)}`); }
    function getProductName(product){
      if(currentLang === 'ko') return product.name_kr || product.name_zh || product.name || product.product_name || product.title || t('unnamed');
      return product.name_zh || product.name || product.product_name || product.title || t('unnamed');
    }
    function getProductOption(product){
      if(currentLang === 'ko') return product.option_kr || product.option || product.variant || product.spec || '';
      return product.option || product.variant || product.spec || '';
    }
    function getProductUrl(product){ return product.olive_url || product.product_url || product.url || product.link || ''; }

    function findProductById(id){
      return allProducts.find(product => getProductId(product) === String(id));
    }

    function getRemainingQty(product){
      return Math.max(Number(product.order_count || 0) - Number(product.purchase_count || 0), 0);
    }

    function updatePurchaseDraft(id, delta){
      const product = findProductById(id);
      if(!product) return;
      const max = getRemainingQty(product);
      const current = Number(purchaseDrafts[id] ?? (max > 0 ? max : 0));
      purchaseDrafts[id] = Math.max(0, Math.min(max, current + Number(delta || 0)));
      renderAll();
    }

    async function completePurchase(id){
      const product = findProductById(id);
      if(!product) return alert(t('notFound'));

      const addQty = Number(purchaseDrafts[id] ?? getRemainingQty(product));
      if(addQty <= 0) return alert(t('setQty'));

      const client = initSupabaseClient();
      if(!client) return;

      const currentPurchased = Number(product.purchase_count || 0);
      const orderQty = Number(product.order_count || 0);
      const newPurchased = Math.min(currentPurchased + addQty, orderQty);

      const btn = document.querySelector(`[data-product-id="${cssEscape(id)}"] .finish-btn`);
      if(btn){ btn.classList.add('is-loading'); btn.innerText = t('writing'); }

      try{
        const { error } = await client
          .from('products')
          .update({ purchase_count: newPurchased })
          .eq('id', product.id);

        if(error) throw error;

        product.purchase_count = newPurchased;
        purchaseDrafts[id] = Math.max(orderQty - newPurchased, 0);
        renderAll();
      }catch(error){
        const message = error && error.message ? error.message : String(error);
        alert(`${t('writeFailPrefix')}：${message}`);
      }
    }

    function copyPurchaseText(){
      const products = getFilteredProducts();
      if(!products.length) return alert(t('noCopy'));
      const text = products.map(product => {
        const name = getProductName(product);
        const option = getProductOption(product);
        const qty = Number(product.order_count || 0);
        const url = getProductUrl(product) || t('noUrl');
        return `${name}${option ? '｜' + option : ''}\n下單數量：${qty}\n商品網址：${url}`;
      }).join('\n\n');

      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(()=>alert(t('copied'))).catch(()=>fallbackCopy(text));
      }else{
        fallbackCopy(text);
      }
    }

    function fallbackCopy(text){
      const area = document.createElement('textarea');
      area.value = text;
      area.style.position = 'fixed';
      area.style.left = '-9999px';
      document.body.appendChild(area);
      area.focus();
      area.select();
      document.execCommand('copy');
      area.remove();
      alert(t('copied'));
    }

    function cssEscape(value){
      if(window.CSS && typeof window.CSS.escape === 'function') return window.CSS.escape(String(value));
      return String(value == null ? '' : value).replace(/[^a-zA-Z0-9_-]/g, match => `\\${match}`);
    }

    function loadingHtml(text){ return `<div class="empty"><iconify-icon icon="svg-spinners:180-ring"></iconify-icon>${text}</div>`; }
    function emptyHtml(text){ return `<div class="empty"><iconify-icon icon="solar:suitcase-bold"></iconify-icon>${text}</div>`; }
    function escapeHtml(v){ return String(v == null ? '' : v).replace(/[&<>'"]/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[s])); }
    function escapeAttr(v){ return escapeHtml(v); }
    function escapeJs(v){ return String(v == null ? '' : v).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,'\\n').replace(/\r/g,''); }
  </script>
</body>
</html>
